<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="How NUDGE works: follow, consent, confirm, alerts, unsubscribe">
<rect width="1200" height="360" rx="18" fill="#f4f7fb"/>
<g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="middle">
<text x="600" y="48" font-size="24" font-weight="800" fill="#10233a">From first follow to the inbox, with consent at every step</text>
<g transform="translate(40,90)">
<g><rect width="200" height="190" rx="14" fill="#fff" stroke="#dfe7f0"/><circle cx="100" cy="46" r="26" fill="#336699"/><text x="100" y="56" font-size="28" fill="#fff">+</text><text x="100" y="102" font-size="18" font-weight="700" fill="#10233a">1. Follow</text><text x="100" y="128" font-size="14" fill="#46566a">A story, category,</text><text x="100" y="148" font-size="14" fill="#46566a">product, game or site</text></g>
<g transform="translate(225,0)"><rect width="200" height="190" rx="14" fill="#fff" stroke="#dfe7f0"/><circle cx="100" cy="46" r="26" fill="#336699"/><text x="100" y="56" font-size="26" fill="#fff">&#10003;</text><text x="100" y="102" font-size="18" font-weight="700" fill="#10233a">2. Consent</text><text x="100" y="128" font-size="14" fill="#46566a">Exact wording logged,</text><text x="100" y="148" font-size="14" fill="#46566a">age check if needed</text></g>
<g transform="translate(450,0)"><rect width="200" height="190" rx="14" fill="#fff" stroke="#dfe7f0"/><circle cx="100" cy="46" r="26" fill="#f39510"/><text x="100" y="56" font-size="24" fill="#fff">@</text><text x="100" y="102" font-size="18" font-weight="700" fill="#10233a">3. Confirm</text><text x="100" y="128" font-size="14" fill="#46566a">Double opt-in email,</text><text x="100" y="148" font-size="14" fill="#46566a">one button to press</text></g>
<g transform="translate(675,0)"><rect width="200" height="190" rx="14" fill="#fff" stroke="#dfe7f0"/><circle cx="100" cy="46" r="26" fill="#f39510"/><text x="100" y="55" font-size="24" fill="#fff">&#9830;</text><text x="100" y="102" font-size="18" font-weight="700" fill="#10233a">4. Alerts</text><text x="100" y="128" font-size="14" fill="#46566a">Push and digest, with</text><text x="100" y="148" font-size="14" fill="#46566a">caps and quiet hours</text></g>
<g transform="translate(900,0)"><rect width="200" height="190" rx="14" fill="#fff" stroke="#dfe7f0"/><circle cx="100" cy="46" r="26" fill="#46566a"/><text x="100" y="55" font-size="24" fill="#fff">&#215;</text><text x="100" y="102" font-size="18" font-weight="700" fill="#10233a">5. Leave</text><text x="100" y="128" font-size="14" fill="#46566a">One-click unsubscribe,</text><text x="100" y="148" font-size="14" fill="#46566a">data erased, hash kept</text></g>
</g>
<g fill="#336699" font-size="26"><text x="252" y="195">&#8250;</text><text x="477" y="195">&#8250;</text><text x="702" y="195">&#8250;</text><text x="927" y="195">&#8250;</text></g>
<text x="600" y="326" font-size="15" fill="#46566a">Mail scanners cannot confirm or unsubscribe anyone: links only act on a press of the button.</text>
