<rect width="1200" height="520" rx="18" fill="#f6f7f7"/>
<g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<g transform="translate(60,40)"><rect width="480" height="440" rx="14" fill="#fff" stroke="#dcdcde"/><rect width="480" height="64" rx="14" fill="#f0f0f1"/><rect y="48" width="480" height="16" fill="#f0f0f1"/>
<text x="24" y="28" font-size="13" fill="#787c82">From: Your Site</text><text x="24" y="50" font-size="16" font-weight="700" fill="#1d2327">Confirm your newsletter</text>
<text x="40" y="120" font-size="16" fill="#1d2327">Please confirm you asked for the newsletter</text><text x="40" y="146" font-size="16" fill="#1d2327">and that you are 18 or over.</text>
<rect x="40" y="190" width="300" height="52" rx="26" fill="#2271b1"/><text x="190" y="223" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">Confirm my subscription</text>
